name: Build Windows x64 (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    env:
      vcvarsall-path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat'
      vcinstall-path: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC'
      qt-ver: '5.15.2'
      qt-arch: 'win64_msvc2019_64'
      qt-arch-install: 'msvc2019_64'

    steps:
      # 安裝 Qt 5.15.2 x64（內建快取）
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: ${{ env.qt-ver }}
          target: desktop
          arch: ${{ env.qt-arch }}
          cache: true
          cache-key-prefix: qt-cache

      # 拉取程式碼（含 submodule）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

            # 編譯
      - name: Build MSVC x64
        shell: cmd
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_QT_PATH: ${{ github.workspace }}/${{ env.qt-ver }}
        run: |
          echo 3.3.3 > QtScrcpy\appversion
          call "ci\win\build_for_win.bat" ${{ github.event.inputs.build_type }} x64

      # 打包
      - name: Package
        shell: cmd
        env:
          ENV_VCVARSALL: ${{ env.vcvarsall-path }}
          ENV_VCINSTALL: ${{ env.vcinstall-path }}
          ENV_QT_PATH: ${{ github.workspace }}/${{ env.qt-ver }}
        run: |
          cmd.exe /c ci\win\publish_for_win.bat x64 ..\build\QtScrcpy-win-x64-custom

      # 上傳 artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-win-x64-custom
          path: ci\build\QtScrcpy-win-x64-custom
          retention-days: 7
